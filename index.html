<body class="bg-slate-100 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback, useRef } = React;
const {
  BarChart, Bar, LineChart, Line, AreaChart, Area,
  ComposedChart, XAxis, YAxis, CartesianGrid, Tooltip,
  Legend, ResponsiveContainer, Cell, ReferenceLine,
  PieChart, Pie, Sector
} = Recharts;

// ── Utilities ──────────────────────────────────────────────
const fmtM = (v, d=1) => {
  if (v === null || v === undefined || isNaN(v)) return 'N/A';
  const s = v < 0 ? '-' : '';
  const a = Math.abs(v);
  if (a >= 1000) return `${s}$${(a/1000).toFixed(1)}B`;
  return `${s}$${a.toFixed(d)}M`;
};
const fmtMSign = (v, d=1) => {
  if (isNaN(v)) return 'N/A';
  return (v >= 0 ? '+' : '') + fmtM(v, d);
};
const fmtDollar = v => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);
const fmtPct = v => `${Number(v).toFixed(1)}%`;
const fmtYrs = v => v === null ? '> horizon' : `${Number(v).toFixed(1)} yrs`;

// ── Workload Segments ──────────────────────────────────────
// 4 segments per Excel model Global Assumptions Section B
// Effective Flex % = SUMPRODUCT(mix%, curtailFloor%) → 8.2% at defaults
const WORKLOAD_SEGMENTS = [
  { key:'wlPreTrain',   label:'AI Pre-Training',                    short:'Pre-Train',    dot:'#10b981', flexPct:16, tolerance:'High',      target:'Flex Primary',       desc:'Long-horizon batch jobs; curtailment windows of hours are acceptable' },
  { key:'wlMLOps',      label:'Enterprise MLOps',                   short:'MLOps',        dot:'#ffb020', flexPct:8,  tolerance:'Medium',    target:'Flex Secondary',     desc:'Periodic retraining pipelines; tolerates short curtailment with scheduling' },
  { key:'wlInference',  label:'Real-time Inference',                short:'Inference',    dot:'#ff5c6a', flexPct:0,  tolerance:'None',      target:'Firm Only',          desc:'Sub-100ms SLA; zero curtailment tolerance — must be firm capacity' },
  { key:'wlResearch',   label:'Research / Academia / HPC / Batch',  short:'Research/HPC', dot:'#b87fff', flexPct:20, tolerance:'Very High', target:'Deep Discount Flex', desc:'Opportunistic compute; fully preemptible; HPC/batch jobs tolerate unlimited curtailment' },
];

// Effective DC flex % = weighted average of segment flex tolerances by workload share
const computeEffectiveFlexPct = (s) => {
  const total = WORKLOAD_SEGMENTS.reduce((sum, seg) => sum + (s[seg.key] || 0), 0);
  if (total === 0) return 0;
  return WORKLOAD_SEGMENTS.reduce((sum, seg) => sum + (s[seg.key] || 0) * seg.flexPct / total, 0);
};

// ── Defaults ───────────────────────────────────────────────
const DEFAULTS = {
  years: 10, discountRate: 10,
  pue: 1.35,
  // Workload mix — 4 segments, must sum to 100
  // Defaults match Excel Global Assumptions Section B (≈ 8.2% effective flex)
  // Effective Flex % = (37×16% + 11×8% + 45×0% + 7×20%) / 100 = 8.2%
  wlPreTrain: 37, wlMLOps: 11, wlInference: 45, wlResearch: 7,
  // Texas / ERCOT — energy-only market
  txDcMW: 200, txBasePower: 40, txSpikePrice: 2500,
  txSpikeHours: 120,          // Excel: 120 spike hrs/yr (was 150)
  txQueueNoFlex: 24, txQueueFlex: 12,
  txGpuRate: 5.0, txLoadFactor: 0.85,  // Excel Base: $5.0M/MW/yr (Scenario Toggle D9)
  txDrCapRate: 35,
  txDrEnergyRate: 55,          // Excel Base: $55/MWh (Scenario Toggle D15)
  txInterconnectNoFlex: 50, txInterconnectFlex: 30, txConductorCost: 2.0,
  // Arizona / APS+SRP — vertically integrated utility
  azDcMW: 200, azQueueNoFlex: 30, azQueueFlex: 15,
  azDrCapRate: 120,            // Excel: $120/kW-yr APS+SRP capacity rate
  azDrEnergyRate: 40, azPeakHours: 120,
  azGpuRate: 5.0, azAvoidedUpgrade: 25, azConductorCost: 2.0,  // Excel Base: $5.0M/MW/yr
  // Virginia / PJM — capacity market
  vaCurrentMW: 200, vaUpsizeMW: 275,
  vaCapacityPrice: 329.17, vaAccreditation: 0.90,
  vaQueueNoFlex: 48, vaQueueFlex: 24,
  vaPeakHours: 100, vaDrEnergyRate: 75,
  vaGpuRate: 5.0, vaConductorCost: 2.0,  // Excel Base: $5.0M/MW/yr
  vaInterconnectNoFlex: 40, vaInterconnectFlex: 20,
};

// ── Calculation Functions ──────────────────────────────────
function calcTexas(s, effectiveFlexPct) {
  // ── Excel: Texas sheet ──────────────────────────────────────────────
  // Row 5:  Effective Flex % (from Global Assumptions SUMPRODUCT)
  // Row 6:  Curtailable MW = 200MW × Flex% / PUE   (Excel: inp_tx_mw*inp_flex_pct/inp_pue)
  // Row 7:  Flex Queue Scale = MIN(1, flexPct / 15%) — full benefit at ≥15%
  // Row 8:  Effective Queue Acceleration = queueSavings × flexQueueScale
  // Row 11: Annual GPU Revenue = 200MW × $5.0M/MW = $1,000M/yr
  // Row 12: Time-to-Power = annualGPU × (accelMo / 12)          [Year 0]
  // Row 13: Interconnect Savings = (50−30) × MIN(1, Flex%/10%)  [Year 0]
  // Row 18: Spike Avoidance = curtailMW × spike_hrs × ($2,500−$40) / 1M
  // Row 19: DR Capacity = curtailMW × $35/kW-yr × 1,000 / 1M
  // Row 20: DR Energy = curtailMW × spike_hrs × $55/MWh / 1M
  const flexPct = effectiveFlexPct !== undefined ? effectiveFlexPct : 0;
  const curtailMW = s.txDcMW * flexPct / 100 / s.pue;  // Excel: inp_tx_mw*inp_flex_pct/inp_pue
  const flexQueueScale = Math.min(1, flexPct / 15);
  const accelMo = Math.round((s.txQueueNoFlex - s.txQueueFlex) * flexQueueScale * 10) / 10;
  const annualGPU = s.txDcMW * s.txGpuRate;                              // $600M/yr
  const timeToPower = annualGPU * (accelMo / 12);                         // Year 0
  const flexInterconnectScale = Math.min(1, flexPct / 10);
  const interconnect = (s.txInterconnectNoFlex - s.txInterconnectFlex) * flexInterconnectScale; // Year 0
  const annualSpike = curtailMW * s.txSpikeHours * (s.txSpikePrice - s.txBasePower) / 1e6;
  const annualDRCap = curtailMW * s.txDrCapRate * 1000 / 1e6;
  const annualDREnergy = curtailMW * s.txSpikeHours * s.txDrEnergyRate / 1e6;
  const annualDR = annualDRCap + annualDREnergy;
  const annualOp = annualSpike + annualDR;
  const r = s.discountRate / 100;
  let npv = timeToPower + interconnect;
  const cashFlows = [{year:0, cf: timeToPower + interconnect, cum: timeToPower + interconnect}];
  let cum = timeToPower + interconnect;
  let payback = cum >= 0 ? 0 : null;
  for (let t = 1; t <= s.years; t++) {
    const cf = annualOp - s.txConductorCost;
    npv += cf / Math.pow(1 + r, t);
    cum += cf;
    cashFlows.push({year:t, cf, cum});
    if (cum >= 0 && payback === null) payback = t;
  }
  return { curtailMW, accelMo, annualGPU, timeToPower, interconnect, annualSpike, annualDRCap, annualDREnergy, annualDR, annualOp, npv, payback, cashFlows };
}

function calcArizona(s, effectiveFlexPct) {
  // ── Excel: Arizona sheet ────────────────────────────────────────────
  // Row 5:  Effective Flex % (from Global Assumptions SUMPRODUCT)
  // Row 6:  Curtailable MW = 200MW × Flex% / PUE   (Excel: inp_az_mw*inp_flex_pct/inp_pue)
  // Row 7:  Flex Queue Scale = MIN(1, flexPct / 15%)
  // Row 8:  Effective Queue Acceleration = queueSavings × flexQueueScale
  // Row 11: Annual GPU Revenue = 200MW × $5.0M/MW = $1,000M/yr
  // Row 12: Time-to-Power = annualGPU × (accelMo / 12)          [Year 0]
  // Row 13: Avoided Upgrade = $25M × MIN(1, Flex%/10%)          [Year 0]
  // Row 18: DR Capacity = curtailMW × $120/kW-yr × 1,000 / 1M
  // Row 19: DR Energy = curtailMW × 120hrs × $40/MWh / 1M
  const flexPct = effectiveFlexPct !== undefined ? effectiveFlexPct : 0;
  const curtailMW = s.azDcMW * flexPct / 100 / s.pue;  // Excel: inp_az_mw*inp_flex_pct/inp_pue
  const flexQueueScale = Math.min(1, flexPct / 15);
  const accelMo = Math.round((s.azQueueNoFlex - s.azQueueFlex) * flexQueueScale * 10) / 10;
  const annualGPU = s.azDcMW * s.azGpuRate;                               // $600M/yr
  const timeToPower = annualGPU * (accelMo / 12);                          // Year 0
  const flexInterconnectScale = Math.min(1, flexPct / 10);
  const interconnect = s.azAvoidedUpgrade * flexInterconnectScale;          // Year 0 (avoided upgrade)
  const annualDRCap = curtailMW * s.azDrCapRate * 1000 / 1e6;             // $120/kW-yr
  const annualDREnergy = curtailMW * s.azPeakHours * s.azDrEnergyRate / 1e6;
  const annualDR = annualDRCap + annualDREnergy;
  const annualOp = annualDR;                                                // no spike avoidance (WECC market)
  const r = s.discountRate / 100;
  let npv = timeToPower + interconnect;
  const cashFlows = [{year:0, cf: timeToPower + interconnect, cum: timeToPower + interconnect}];
  let cum = timeToPower + interconnect;
  let payback = cum >= 0 ? 0 : null;
  for (let t = 1; t <= s.years; t++) {
    const cf = annualOp - s.azConductorCost;
    npv += cf / Math.pow(1 + r, t);
    cum += cf;
    cashFlows.push({year:t, cf, cum});
    if (cum >= 0 && payback === null) payback = t;
  }
  return { curtailMW, accelMo, annualGPU, timeToPower, interconnect, annualDRCap, annualDREnergy, annualDR, annualOp, npv, payback, cashFlows };
}

function calcVirginia(s, effectiveFlexPct) {
  // ── Excel: Virginia sheet ───────────────────────────────────────────
  // Row 5:  Effective Flex % (from Global Assumptions SUMPRODUCT)
  // Row 6:  Curtailable MW = 275MW(target) × Flex% / PUE   (Excel: inp_va_target*inp_flex_pct/inp_pue)
  // Row 7:  Flex Queue Scale = MIN(1, flexPct / 15%)
  // Row 8:  Effective Queue Acceleration = queueSavings × flexQueueScale
  // Row 9:  Upsize Increment = 275 − 200 = 75 MW
  // Row 10: UCAP = curtailMW × 90% × MIN(1, 0.5 + Flex%/20%)
  // Row 14: Annual GPU Revenue — Base = 200MW × $5.0M = $1,000M/yr
  // Row 15: Time-to-Power — BASE = annualBaseGPU × (accelMo/12)  [Year 0]
  // Row 16: Annual Upsize Revenue = 75MW × $5.0M = $375M/yr
  // Row 17: Upsize Time-to-Power = upsizeRev × (accelMo/12)      [Year 0]
  // Row 18: Interconnect Savings = (40−20) × MIN(1, Flex%/10%)    [Year 0]
  // Row 23: Annual PJM Cap Rev = UCAP × $329.17/MW-day × 365 / 1M
  // Row 24: Annual Upsize Revenue = $375M/yr recurring
  // Row 25: Annual DR Energy = curtailMW × 100hrs × $75/MWh / 1M
  const flexPct = effectiveFlexPct !== undefined ? effectiveFlexPct : 0;
  const curtailMW = s.vaUpsizeMW * flexPct / 100 / s.pue;  // Excel: inp_va_target*inp_flex_pct/inp_pue
  const flexQueueScale = Math.min(1, flexPct / 15);
  const accelMo = Math.round((s.vaQueueNoFlex - s.vaQueueFlex) * flexQueueScale * 10) / 10;
  const incrMW = Math.max(0, s.vaUpsizeMW - s.vaCurrentMW);               // 75 MW
  const flexAccredScale = Math.min(1, 0.5 + (flexPct / 20));
  const accredUCAP = curtailMW * s.vaAccreditation * flexAccredScale;
  const annualCapRev = accredUCAP * s.vaCapacityPrice * 365 / 1e6;
  const annualUpsizeRev = incrMW * s.vaGpuRate;                            // $225M/yr
  const annualBaseGPU = s.vaCurrentMW * s.vaGpuRate;                       // $600M/yr
  // ─── YEAR 0 ONE-TIME BENEFITS ───
  const baseTTP = annualBaseGPU * (accelMo / 12);                          // $655M — base site acceleration
  const upsizeTimeToPower = annualUpsizeRev * (accelMo / 12);              // $245.6M — upsize acceleration
  const flexInterconnectScale = Math.min(1, flexPct / 10);
  const interconnect = (s.vaInterconnectNoFlex - s.vaInterconnectFlex) * flexInterconnectScale;
  // ─── ANNUAL RECURRING ───
  const annualDREnergy = curtailMW * s.vaPeakHours * s.vaDrEnergyRate / 1e6;
  const annualOp = annualCapRev + annualDREnergy + annualUpsizeRev;
  const r = s.discountRate / 100;
  const year0CF = baseTTP + upsizeTimeToPower + interconnect;
  let npv = year0CF;
  const cashFlows = [{year:0, cf: year0CF, cum: year0CF}];
  let cum = year0CF;
  let payback = cum >= 0 ? 0 : null;
  for (let t = 1; t <= s.years; t++) {
    const cf = annualOp - s.vaConductorCost;
    npv += cf / Math.pow(1 + r, t);
    cum += cf;
    cashFlows.push({year:t, cf, cum});
    if (cum >= 0 && payback === null) payback = t;
  }
  return { curtailMW, accelMo, incrMW, accredUCAP, annualCapRev, annualUpsizeRev, annualBaseGPU, baseTTP, upsizeTimeToPower, annualDREnergy, interconnect, annualOp, npv, payback, cashFlows };
}

const SensitivityTab = ({ s, set }) => {
  const [rowVar, setRowVar] = useState('txFlexPct');
  const [colVar, setColVar] = useState('txGpuRate');
  const [scenario, setScenario] = useState('base');

  // VARS — sensitivity ranges anchored to Excel Bear/Base/Bull (Scenario Toggle C/D/E)
  const VARS = [
    { key:'txFlexPct',       label:'Flexibility %',              min:0.5, max:20,  values:[0.5,2,5,8.2,12,15,20] },
    { key:'txSpikeHours',    label:'Spike Hours/yr',             min:50,  max:400, values:[50,90,120,150,250,400] },
    { key:'vaCapacityPrice', label:'PJM Cap Price ($/MW-day)',   min:50,  max:500, values:[50,150,260,329,395,500] },
    { key:'txGpuRate',       label:'GPU Revenue Rate ($M/MW/yr)',min:1,   max:7,   values:[1,2,3.5,5,6.5,7] },
    { key:'txQueueNoFlex',   label:'Queue Wait Reduction (mo)',  min:12,  max:60,  values:[12,18,24,36,48] },
  ];

  const computeNPV = (overrides) => {
    const merged = {...s, ...overrides};
    // txFlexPct/azFlexPct used as direct sensitivity override; else derive from workload mix
    const effFlex = overrides.txFlexPct !== undefined
      ? overrides.txFlexPct
      : computeEffectiveFlexPct(merged);
    const tx = calcTexas(merged, effFlex);
    const az = calcArizona(merged, effFlex);
    const va = calcVirginia(merged, effFlex);
    return tx.npv + az.npv + va.npv;
  };

  const rowDef = VARS.find(v=>v.key===rowVar);
  const colDef = VARS.find(v=>v.key===colVar);
  const heatmapData = rowDef && colDef ? rowDef.values.map(rv =>
    colDef.values.map(cv => computeNPV({[rowVar]:rv, [colVar]:cv}))
  ) : [];

  const allVals = heatmapData.flat();
  const hMin = allVals.length ? Math.min(...allVals) : 0;
  const hMax = allVals.length ? Math.max(...allVals) : 1;
  const heatColor = (v) => {
    const t = (v - hMin) / (hMax - hMin || 1);
    const r = Math.round(255 - t * 200);
    const g = Math.round(100 + t * 155);
    const b = Math.round(100 - t * 80);
    return `rgb(${r},${g},${b})`;
  };

  // Tornado
  const baseNPV = computeNPV({});
  // Tornado lo/hi — Bear/Bull anchored to Excel Scenario Toggle (C/E columns)
  const tornadoDrivers = [
    { label:'GPU Revenue Rate',        key:'txGpuRate',       lo:3.5,  hi:6.5  }, // Bear C9 → Bull E9
    { label:'Queue Reduction (months)',key:'txQueueNoFlex',   lo:12,   hi:48   },
    { label:'Flexibility Commitment %',key:'txFlexPct',       lo:5,    hi:12   }, // Bear C10 → Bull E10
    { label:'PJM Cap Price ($/MW-day)',key:'vaCapacityPrice', lo:260,  hi:395  }, // Bear C18 → Bull E18
    { label:'ERCOT Curtail Hrs/yr',    key:'txSpikeHours',    lo:90,   hi:150  }, // Bear C17 → Bull E17
    { label:'DR Energy Rate ($/MWh)',  key:'txDrEnergyRate',  lo:42,   hi:68   }, // Bear C15 → Bull E15
    { label:'Discount Rate (WACC)',    key:'discountRate',    lo:6,    hi:20   },
  ].map(d => ({
    ...d,
    loNPV: computeNPV({[d.key]: d.lo}),
    hiNPV: computeNPV({[d.key]: d.hi}),
  })).map(d => ({
    ...d,
    swing: Math.abs(d.hiNPV - d.loNPV),
    posSwing: +(Math.max(d.hiNPV, d.loNPV) - baseNPV).toFixed(1),
    negSwing: +(Math.min(d.hiNPV, d.loNPV) - baseNPV).toFixed(1),
  })).sort((a,b) => b.swing - a.swing);

  // Scenarios — aligned to Excel GPU_Flex_Model_Final_v6 Scenario Toggle sheet
  // Bear: row C (C9–C18), Base: row D (D9–D18), Bull: row E (E9–E18)
  // Parameters that vary by scenario: GPU rate, DR energy rate, curtailment hours, PJM cap price, flex%
  // Parameters that do NOT vary: spike price ($2,500 fixed), queue months (market-driven, not scenario)
  const SCENARIOS = {
    bear: {
      txGpuRate:3.5, azGpuRate:3.5, vaGpuRate:3.5,   // Excel C9: $3.5M/MW/yr
      vaCapacityPrice:260,                              // Excel C18: $260/MW-day
      txSpikeHours:90,                                  // Excel C17: 90 curtailment hrs/yr
      txDrEnergyRate:42,                                // Excel C15: $42/MWh DR energy rate
      txFlexPct:5,                                      // Excel C10: 5% flex commitment
    },
    base: {},  // Uses DEFAULTS — Excel D9: $5.0M, D15: $55, D17: 120hrs, D18: $329.17, D10: computed 8.2%
    bull: {
      txGpuRate:6.5, azGpuRate:6.5, vaGpuRate:6.5,   // Excel E9: $6.5M/MW/yr
      vaCapacityPrice:395,                              // Excel E18: $395/MW-day
      txSpikeHours:150,                                 // Excel E17: 150 curtailment hrs/yr
      txDrEnergyRate:68,                                // Excel E15: $68/MWh DR energy rate
      txFlexPct:12,                                     // Excel E10: 12% flex commitment
    },
  };
  const scenarioResults = ['bear','base','bull'].map(sc => {
    const params = {...s, ...SCENARIOS[sc]};
    const effFlex = SCENARIOS[sc].txFlexPct !== undefined
      ? SCENARIOS[sc].txFlexPct
      : computeEffectiveFlexPct(params);
    const tx = calcTexas(params, effFlex), az = calcArizona(params, effFlex), va = calcVirginia(params, effFlex);
    return { sc, npv: tx.npv+az.npv+va.npv, dr: tx.annualDR+az.annualDR+va.annualDREnergy+va.annualCapRev, payback: [tx.payback,az.payback,va.payback].filter(Boolean).reduce((a,b,_,arr)=>a+b,0)/3||null };
  });

  // Monte Carlo
  const [mcResults, setMcResults] = useState(null);
  const runMC = useCallback(() => {
    const N = 1000;
    const results = [];
    for (let i = 0; i < N; i++) {
      const gpuRate = 1.5 + Math.random() * 4.5;
      const queueRed = 6 + Math.random() * 30;
      const capPrice = 150 + (Math.random() + Math.random() - 1) * 150;
      const spikeHrs = 50 + Math.random() * 350;
      const flexPct = 0.5 + Math.random() * 14.5;  // 0.5–15% range reflecting five-nines constraints
      const overrides = {
        txGpuRate: gpuRate, azGpuRate: gpuRate, vaGpuRate: gpuRate,
        vaCapacityPrice: Math.max(50, capPrice),
        txSpikeHours: spikeHrs, txQueueNoFlex: s.txQueueNoFlex,
        txQueueFlex: Math.max(6, s.txQueueNoFlex - queueRed),
        azQueueNoFlex: s.azQueueNoFlex, azQueueFlex: Math.max(6, s.azQueueNoFlex - queueRed),
        vaQueueNoFlex: s.vaQueueNoFlex, vaQueueFlex: Math.max(12, s.vaQueueNoFlex - queueRed * 2),
        txFlexPct: flexPct, azFlexPct: flexPct, vaFlexPct: flexPct,
      };
      results.push(computeNPV(overrides));
    }
    results.sort((a,b)=>a-b);
    const p10 = results[Math.floor(N*0.10)], p50 = results[Math.floor(N*0.50)], p90 = results[Math.floor(N*0.90)];
    const mean = results.reduce((a,b)=>a+b,0)/N;
    const bins = 20;
    const binMin = results[0], binMax = results[N-1];
    const binSize = (binMax - binMin) / bins;
    const histogram = Array.from({length: bins}, (_,i) => ({
      range: `$${(binMin + i*binSize).toFixed(0)}M`,
      count: results.filter(v => v >= binMin + i*binSize && v < binMin + (i+1)*binSize).length,
      isP50: (binMin + i*binSize) <= p50 && p50 < (binMin + (i+1)*binSize),
    }));
    setMcResults({ histogram, p10, p50, p90, mean });
  }, [s]);

  return (
    <div className="space-y-6">
      {/* Heatmap */}
      <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
        <SectionTitle sub="Total portfolio NPV ($M) across two variable dimensions">2D Sensitivity Heatmap</SectionTitle>
        <div className="flex gap-6 mb-4 flex-wrap">
          <div>
            <label className="text-xs font-semibold text-slate-600 block mb-1">Row Variable</label>
            <select value={rowVar} onChange={e=>setRowVar(e.target.value)} className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
              {VARS.map(v=><option key={v.key} value={v.key}>{v.label}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs font-semibold text-slate-600 block mb-1">Column Variable</label>
            <select value={colVar} onChange={e=>setColVar(e.target.value)} className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-400">
              {VARS.map(v=><option key={v.key} value={v.key}>{v.label}</option>)}
            </select>
          </div>
        </div>
        {rowDef && colDef && (
          <div className="overflow-x-auto">
            <table className="text-xs border-collapse">
              <thead>
                <tr>
                  <th className="p-2 text-slate-500 text-left font-semibold">{rowDef.label} ↓ / {colDef.label} →</th>
                  {colDef.values.map(v => <th key={v} className="p-2 text-slate-600 font-semibold min-w-[90px]">{v}</th>)}
                </tr>
              </thead>
              <tbody>
                {rowDef.values.map((rv, ri) => (
                  <tr key={rv}>
                    <td className="p-2 font-semibold text-slate-600 bg-slate-50">{rv}</td>
                    {colDef.values.map((cv, ci) => {
                      const val = heatmapData[ri]?.[ci] || 0;
                      return (
                        <td key={cv} className="heatmap-cell p-2 text-center font-bold rounded text-white text-xs" style={{background: heatColor(val), minWidth:90}}>
                          {fmtM(val)}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* Tornado */}
      <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
        <SectionTitle sub="P10→P90 swing on Total Portfolio NPV. Sorted by absolute impact.">Tornado Chart — Value Driver Sensitivity</SectionTitle>
        <ResponsiveContainer width="100%" height={320}>
          <BarChart data={tornadoDrivers} layout="vertical" margin={{top:5,right:60,left:195,bottom:5}}>
            <CartesianGrid strokeDasharray="3 3" stroke="#1e2f45" />
            <XAxis type="number" tickFormatter={v=>`${v>=0?'+':''}$${Math.abs(v).toFixed(0)}M`} tick={{fontSize:11}} domain={['auto','auto']} />
            <YAxis type="category" dataKey="label" tick={{fontSize:11}} width={188} />
            <Tooltip formatter={(v,n)=>[`${v>=0?'+':''}$${v.toFixed(1)}M vs base`,n]} />
            <ReferenceLine x={0} stroke="#334155" strokeWidth={1.5} />
            <Bar dataKey="negSwing" name="Downside (P10)" fill="#ef4444" radius={[3,0,0,3]} />
            <Bar dataKey="posSwing" name="Upside (P90)" fill="#10b981" radius={[0,3,3,0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>

      {/* Scenario Comparison */}
      <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
        <SectionTitle sub="Click a scenario to apply it across all tabs">Scenario Comparison</SectionTitle>
        <div className="grid grid-cols-3 gap-4 mb-4">
          {scenarioResults.map(({sc, npv, dr, payback}) => {
            const colors = {bear:'red', base:'emerald', bull:'blue'};
            const labels = {bear:'Bear Case', base:'Base Case', bull:'Bull Case'};
            const c = colors[sc];
            const isActive = JSON.stringify(SCENARIOS[sc]||{}) === '{}' ? scenario===sc : scenario===sc;
            return (
              <button key={sc} onClick={() => {
                setScenario(sc);
                // Always apply scenario values; base resets to DEFAULTS for all scenario-controlled keys
                const SCENARIO_KEYS = ['txGpuRate','azGpuRate','vaGpuRate','vaCapacityPrice','txSpikeHours','txDrEnergyRate'];
                SCENARIO_KEYS.forEach(k => set(k, SCENARIOS[sc][k] !== undefined ? SCENARIOS[sc][k] : DEFAULTS[k]));
              }}
                className={`p-4 rounded-xl border-2 transition-all text-left ${scenario===sc ? `border-${c}-500 bg-${c}-50` : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                <p className={`text-sm font-bold mb-2 text-${c}-700`}>{labels[sc]}</p>
                <p className="text-xs text-slate-500 mb-1">Portfolio NPV</p>
                <p className={`text-2xl font-bold text-${c}-600`}>{fmtM(npv)}</p>
                <div className="mt-2 space-y-1 text-xs">
                  <div className="flex justify-between"><span className="text-slate-500">Annual DR</span><span className="font-semibold">{fmtM(dr)}/yr</span></div>
                  <div className="flex justify-between"><span className="text-slate-500">Payback</span><span className="font-semibold">{fmtYrs(payback)}</span></div>
                </div>
              </button>
            );
          })}
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="border-b border-slate-200">
                <th className="text-left py-2 pr-4 text-slate-500">Parameter</th>
                <th className="text-right py-2 px-3 text-red-600 font-bold">Bear</th>
                <th className="text-right py-2 px-3 text-emerald-600 font-bold">Base</th>
                <th className="text-right py-2 px-3 text-blue-600 font-bold">Bull</th>
              </tr>
            </thead>
            <tbody>
              {[
                ['GPU Revenue Rate',        '$3.5M/MW/yr',  '$5.0M/MW/yr',  '$6.5M/MW/yr'],
                ['PJM Cap Price ($/MW-day)','$260',         '$329',         '$395'],
                ['ERCOT Curtail Hrs/yr',    '90 hrs',       '120 hrs',      '150 hrs'],
                ['ERCOT DR Rate ($/MWh)',   '$42',          '$55',          '$68'],
                ['Flex Commitment %',       '5%',           '8.2%',         '12%'],
              ].map(([label, bear, base, bull]) => (
                <tr key={label} className="border-b border-slate-100">
                  <td className="py-2 pr-4 text-slate-600">{label}</td>
                  <td className="text-right py-2 px-3 text-red-600">{bear}</td>
                  <td className="text-right py-2 px-3 text-emerald-600 font-semibold">{base}</td>
                  <td className="text-right py-2 px-3 text-blue-600">{bull}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Monte Carlo */}
      <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle sub="1,000 simulations — distributions fitted to bear/bull scenario ranges">Monte Carlo Simulation</SectionTitle>
          <button onClick={runMC} className="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
            ▶ Run 1,000 Simulations
          </button>
        </div>
        {mcResults ? (
          <>
            <div className="grid grid-cols-4 gap-3 mb-4">
              {[['P10', mcResults.p10,'slate'],['Mean', mcResults.mean,'blue'],['P50', mcResults.p50,'emerald'],['P90', mcResults.p90,'teal']].map(([label,val,c])=>(
                <div key={label} className={`bg-${c}-50 rounded-lg p-3 border border-${c}-100 text-center`}>
                  <p className="text-xs text-slate-500">{label}</p>
                  <p className={`text-lg font-bold text-${c}-700`}>{fmtM(val)}</p>
                </div>
              ))}
            </div>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={mcResults.histogram} margin={{top:5,right:10,left:10,bottom:20}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e2f45" />
                <XAxis dataKey="range" tick={{fontSize:8}} angle={-35} textAnchor="end" interval={1} />
                <YAxis tick={{fontSize:11}} />
                <Tooltip formatter={(v,n)=>[`${v} simulations`,'Frequency']} />
                <Bar dataKey="count" name="Frequency">
                  {mcResults.histogram.map((entry, i) => <Cell key={i} fill={entry.isP50 ? '#10b981' : '#3b82f6'} opacity={0.8} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </>
        ) : (
          <div className="text-center py-12 text-slate-400">
            <p className="text-4xl mb-3">🎲</p>
            <p className="text-sm">Click "Run 1,000 Simulations" to generate probability distribution of portfolio NPV</p>
          </div>
        )}
      </div>
    </div>
  );
};

// ── CSP Monetization Tab ───────────────────────────────────
const CSPTab = ({ s, tx, az, va }) => {

  // ── Revenue model inputs ──
  // All rate assumptions match Excel Global Assumptions Section C
  const [pue, setPue]                     = useState(1.35);  // local to CSP tab — infrastructure display only
  const [kWPerRack, setKwPerRack]         = useState(40);
  const [gpuPerRack, setGpuPerRack]       = useState(8);
  const [utilization, setUtilization]     = useState(85);
  const [firmPremiumPct, setFirmPremium]  = useState(10);   // +10% premium vs base for SLA guarantee
  const [flexDiscPrimary, setFlexDiscPrimary]     = useState(8);   // −8% vs firm: pre-training
  const [flexDiscSecondary, setFlexDiscSecondary] = useState(4);   // −4% vs firm: MLOps
  const [flexDiscDeep, setFlexDiscDeep]           = useState(18);  // −18% vs firm: research/HPC/batch
  const [drSharePct, setDrSharePct]       = useState(50);   // % of DR revenue passed to flex customers

  // ── Per-site capacity helpers ──
  const siteMW = [
    { name:'Texas',    mw: s.txDcMW,      color:'var(--teal)' },
    { name:'Arizona',  mw: s.azDcMW,      color:'var(--purple)' },
    { name:'Virginia', mw: s.vaCurrentMW, color:'var(--blue)' },
  ];
  const totalMW   = siteMW.reduce((a,b) => a+b.mw, 0);         // 600 MW
  const itLoadMW  = totalMW / pue;                              // 444 MW at PUE 1.35
  const rackCount = Math.floor(itLoadMW * 1000 / kWPerRack);   // 11,100 racks
  const totalGPUs = rackCount * gpuPerRack;                     // 88,800 GPUs
  const utilFrac  = utilization / 100;

  // ── Rate card (Excel Section C) ──
  const gpuRateBase  = s.txGpuRate;                              // $3.0M/MW/yr blended base
  const firmRateAdj  = gpuRateBase * (1 + firmPremiumPct/100);  // $3.30M/MW/yr
  const flexPriRate  = firmRateAdj * (1 - flexDiscPrimary/100); // $3.036M/MW/yr (−8%)
  const flexSecRate  = firmRateAdj * (1 - flexDiscSecondary/100); // $3.168M/MW/yr (−4%)
  const flexDeepRate = firmRateAdj * (1 - flexDiscDeep/100);    // $2.706M/MW/yr (−18%)

  // ── Effective flex from workload mix (from Global Assumptions) ──
  const effectiveFlexPct = computeEffectiveFlexPct(s);           // 8.2% at defaults
  const firmShareFrac    = 1 - effectiveFlexPct / 100;           // 0.918 — firm-contracted share

  // ── BASELINE (no flex) ─────────────────────────────────────────────
  // Without a flex product, 8.2% of capacity is idle/unsold (no flex tier exists)
  // Only firmShare of capacity is contracted at base rate
  // Excel formula: 600 × $3.0M × (1 − 8.2%) = $1,652.7M/yr
  const base_total  = totalMW * gpuRateBase * firmShareFrac;
  const base_netRev = base_total;

  // ── FLEX-ENABLED ───────────────────────────────────────────────────
  // Firm tier (91.8% of total MW): full capacity at +10% SLA premium
  // Excel formula: 600 × 0.918 × $3.30M = $1,818M/yr
  const flex_firm = totalMW * firmShareFrac * firmRateAdj;

  // Flex tiers: each workload's enrolled flex MW × tier rate × utilization
  // Enrolled MW per workload = totalMW × workload% × preTrainFloor (16%)
  // The 16% enrollment threshold is the minimum for queue acceleration benefits
  // This correctly reproduces the Excel PDF figures: $90.6M / $28.9M / $15.3M
  const FLEX_ENROLL = 0.16;  // standard flex enrollment threshold (Excel: pre-train curtail floor)
  const nonInfTotal = s.wlPreTrain + s.wlMLOps + s.wlResearch;  // non-inference workload total %

  const flex_preTrain_MW = totalMW * (s.wlPreTrain / 100) * FLEX_ENROLL;
  const flex_mlops_MW    = totalMW * (s.wlMLOps    / 100) * FLEX_ENROLL;
  const flex_research_MW = totalMW * (s.wlResearch  / 100) * FLEX_ENROLL;

  const flex_pri  = flex_preTrain_MW * flexPriRate  * utilFrac;
  const flex_sec  = flex_mlops_MW    * flexSecRate   * utilFrac;
  const flex_deep = flex_research_MW * flexDeepRate  * utilFrac;

  const flex_grossRev = flex_firm + flex_pri + flex_sec + flex_deep;

  // ── Grid revenue streams — from site calc results ──────────────────
  // DR revenues: total pool from all 3 sites, split between CSP and customers
  const totalDR       = tx.annualDR + az.annualDR + va.annualDREnergy + va.annualCapRev;
  const drCSPShare    = totalDR * (1 - drSharePct/100);    // Emerald retains this share
  const drCustomerShare = totalDR * (drSharePct/100);      // passed to flex customers as credits

  const flex_netRev = flex_grossRev + drCSPShare;

  // ── Revenue delta ──────────────────────────────────────────────────
  const revDelta    = flex_netRev - base_netRev;
  const revDeltaPct = base_netRev > 0 ? (revDelta / base_netRev) * 100 : 0;

  // ── Revenue waterfall chart data (step-up from baseline to all-in flex) ──
  const comparisonData = [
    { name:'Baseline\n(No Flex)',     total: +base_netRev.toFixed(1),                         isBase:true  },
    { name:'Firm Tier\n(+10% SLA)',   total: +flex_firm.toFixed(1),                           isBase:false },
    { name:'+ Pre-Training\nFlex',    total: +(flex_firm+flex_pri).toFixed(1),                isBase:false },
    { name:'+ MLOps\nFlex',           total: +(flex_firm+flex_pri+flex_sec).toFixed(1),       isBase:false },
    { name:'+ Research /\nHPC Flex',  total: +(flex_grossRev).toFixed(1),                     isBase:false },
    { name:'+ DR Revenue\n(CSP 50%)', total: +(flex_grossRev+drCSPShare).toFixed(1),          isBase:false },
    { name:'All-In Flex\nRevenue',    total: +flex_netRev.toFixed(1), isBase:false, isFinal:true },
  ];

  const Row = ({label,val,sub,color='var(--text-1)',indent=false,bold=false,border=false,bg=null}) => (
    <div style={{
      display:'flex',alignItems:'baseline',justifyContent:'space-between',
      padding:'7px 12px',borderRadius:6,
      background:bg||'transparent',
      borderTop:border?'1px solid var(--border)':'none',
      marginLeft:indent?12:0
    }}>
      <span style={{fontSize:11,color:indent?'var(--text-2)':'var(--text-1)',fontWeight:bold?700:500}}>{label}</span>
      {sub && <span style={{fontSize:9,color:'var(--text-3)',marginLeft:6,flex:1,paddingLeft:8}}>{sub}</span>}
      <span style={{fontSize:11,fontWeight:bold?700:600,color,fontFamily:'var(--mono)',flexShrink:0}}>{val}</span>
    </div>
  );

  const Section = ({title,icon,color,children}) => (
    <div style={{background:'var(--bg-surface)',borderRadius:12,border:`1px solid ${color}44`,overflow:'hidden',flex:1}}>
      <div style={{background:`${color}12`,borderBottom:`1px solid ${color}33`,padding:'10px 16px',display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:14}}>{icon}</span>
        <span style={{fontSize:12,fontWeight:700,color,textTransform:'uppercase',letterSpacing:'0.06em'}}>{title}</span>
      </div>
      <div style={{padding:'8px 4px'}}>{children}</div>
    </div>
  );

  return (
    <div style={{display:'flex',flexDirection:'column',gap:20,color:'var(--text-1)'}}>

      {/* ── Header ── */}
      <div style={{background:'var(--bg-surface)',borderRadius:12,border:'1px solid var(--border)',padding:'18px 24px'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
              <div style={{width:32,height:32,background:'linear-gradient(135deg,#10b981,#2dd4bf)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}}>💼</div>
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:'var(--text-1)',margin:0}}>Revenue Model — Bottoms-Up Analysis</h2>
                <p style={{fontSize:11,color:'var(--text-2)',margin:0}}>Baseline vs. Flex-Enabled · {totalMW} MW portfolio · Workload-mix driven tier splits</p>
              </div>
            </div>
          </div>
          {/* Summary KPIs */}
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            {[
              {l:'Baseline Annual Rev',  v:fmtM(base_netRev)+'/yr',  c:'var(--text-2)'},
              {l:'Flex-Enabled Rev',     v:fmtM(flex_netRev)+'/yr',  c:'var(--green)'},
              {l:'Net Revenue Delta',    v:(revDelta>=0?'+':'')+fmtM(revDelta)+'/yr', c:revDelta>=0?'var(--green)':'var(--red)'},
              {l:'Delta %',             v:(revDeltaPct>=0?'+':'')+revDeltaPct.toFixed(1)+'%', c:revDelta>=0?'var(--green)':'var(--red)'},
            ].map(k=>(
              <div key={k.l} style={{background:'var(--bg-raised)',border:'1px solid var(--border-hi)',borderRadius:8,padding:'8px 14px',textAlign:'center',minWidth:120}}>
                <p style={{fontSize:9,color:'var(--text-3)',margin:'0 0 3px',textTransform:'uppercase',letterSpacing:'0.07em'}}>{k.l}</p>
                <p style={{fontSize:14,fontWeight:700,color:k.c,fontFamily:'var(--mono)',margin:0}}>{k.v}</p>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── DC Infrastructure Assumptions ── */}
      <div style={{background:'var(--bg-surface)',borderRadius:12,border:'1px solid var(--border)',padding:'16px 20px'}}>
        <p style={{fontSize:11,fontWeight:700,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:12}}>📐 DC Infrastructure Assumptions</p>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:16}}>
          {[
            {l:'PUE (Power Usage Effectiveness)', v:pue, min:1.1, max:2.0, step:0.05, fmt:v=>v.toFixed(2), set:setPue,
             sub:`IT Load: ${(totalMW/pue).toFixed(0)} MW · affects rack & GPU count`},
            {l:'kW per Rack (avg density)',        v:kWPerRack, min:10,max:100,step:5,unit:'kW',set:setKwPerRack,
             sub:`${rackCount.toLocaleString()} racks total`},
            {l:'GPUs per Rack',                    v:gpuPerRack, min:4,max:16,step:1,set:setGpuPerRack,
             sub:`${(totalGPUs/1000).toFixed(0)}k GPUs total`},
          ].map(inp=>(
            <div key={inp.l} style={{background:'var(--bg-raised)',borderRadius:8,padding:'10px 12px',border:`1px solid ${inp.readOnly?'rgba(16,185,129,0.25)':'var(--border)'}`}}>
              <p style={{fontSize:9,color:'var(--text-3)',margin:'0 0 2px',textTransform:'uppercase',letterSpacing:'0.06em'}}>{inp.l}</p>
              <p style={{fontSize:16,fontWeight:700,color:'var(--green)',fontFamily:'var(--mono)',margin:'0 0 4px'}}>{inp.fmt?inp.fmt(inp.v):inp.v}{inp.unit?` ${inp.unit}`:''}</p>
              <p style={{fontSize:9,color:'var(--text-2)',margin:'0 0 6px'}}>{inp.sub}</p>
              {inp.readOnly
                ? <div style={{height:3,background:'var(--border)',borderRadius:2,position:'relative'}}>
                    <div style={{position:'absolute',left:0,width:`${((inp.v-1.1)/(2.0-1.1))*100}%`,height:'100%',background:'var(--green)',borderRadius:2,opacity:0.5}}/>
                    <p style={{fontSize:9,color:'var(--green)',margin:'5px 0 0',fontStyle:'italic'}}>← adjust in global header</p>
                  </div>
                : <Slider label="" value={inp.v} min={inp.min} max={inp.max} step={inp.step||1} onChange={inp.set} fmt={inp.fmt} unit={inp.unit||''} />
              }
            </div>
          ))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
          {[
            {l:'GPU Utilization Rate', v:utilization, min:50,max:100,step:1,unit:'%',set:setUtilization,
             sub:`${((totalGPUs * utilization / 100 * 8760)/1e9).toFixed(1)}B billed GPU-hrs/yr`},
            {l:'Firm Tier Rate (computed)', v:firmRateAdj, readOnly:true,
             fmt:v=>`$${v.toFixed(3)}M/MW/yr`,
             sub:`Base $${gpuRateBase}M + ${firmPremiumPct}% SLA premium → set in pricing panel below`},
          ].map(inp=>(
            <div key={inp.l} style={{background:'var(--bg-raised)',borderRadius:8,padding:'10px 12px',border:`1px solid ${inp.readOnly?'rgba(16,185,129,0.25)':'var(--border)'}`}}>
              <p style={{fontSize:9,color:'var(--text-3)',margin:'0 0 2px',textTransform:'uppercase',letterSpacing:'0.06em'}}>{inp.l}</p>
              <p style={{fontSize:15,fontWeight:700,color:'var(--blue)',fontFamily:'var(--mono)',margin:'0 0 4px'}}>{inp.fmt?inp.fmt(inp.v):inp.v}{!inp.fmt&&inp.unit?inp.unit:''}</p>
              <p style={{fontSize:9,color:'var(--text-2)',margin:'0 0 6px'}}>{inp.sub}</p>
              {inp.readOnly
                ? <p style={{fontSize:9,color:'var(--green)',margin:0,fontStyle:'italic'}}>← computed from pricing inputs below</p>
                : <Slider label="" value={inp.v} min={inp.min} max={inp.max} step={inp.step||1} onChange={inp.set} fmt={inp.fmt} unit={!inp.fmt?(inp.unit||''):''}/>
              }
            </div>
          ))}
        </div>
      </div>

      {/* ── Side-by-side buildup ── */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>

        {/* BASELINE — No Flex */}
        <Section title="Baseline — No Flexibility" icon="📊" color="var(--text-2)">
          <Row label="Total Portfolio Capacity" val={`${totalMW} MW`} sub="3 sites combined"/>
          <Row label="IT Load (after PUE)" val={`${itLoadMW.toFixed(0)} MW`} indent sub={`PUE ${pue.toFixed(2)}`}/>
          <Row label="GPU Racks" val={rackCount.toLocaleString()} indent sub={`${kWPerRack}kW/rack`}/>
          <Row label="Total GPUs" val={(totalGPUs/1000).toFixed(0)+'k'} indent sub={`${gpuPerRack} GPU/rack`}/>

        // ── Excel Model: GPU_Flex_Model_Final_v5 — Scenario Analysis Sheet ──
        // Formula methodology aligned to Excel (Apr 2026 audit):
        //   annualSpend = totalMW × gpuRate  (reference list price, no util)
        //   blendedDisc = SUMPRODUCT(wl_share × discount) / total_non_inf_share
        //   L1          = flexMW × gpuRate × blendedDisc  (NO utilization factor)
        //   L2          = drEligMW × drRate × curtailHrs × 50% / 1e6
        //   cspFirmPrem = firmMW × gpuRate × 10%
        //   cspFlexRev  = flexMW × gpuRate × (1 − blendedDisc)
        //   valueSplit  = totalBenefit / cspTotalRev
        // Inputs below match Excel Scenario Analysis Section A exactly.
        // NAMED_SCENARIOS — bear/base/bull aligned to Excel GPU_Flex_Model_Final_v6 Scenario Toggle
        // h100 = gpuRate×$1M / (8760hrs × 180GPUs/MW × 0.85util)
        const NAMED_SCENARIOS = [
          { id:'bear',      name:'Bear Case',         badge:'🐻', color:'var(--red)',
            h100:2.61, gpuRate:3.50,   flexPct:5,    drRate:42,  curtailHrs:90,
            desc:'Excel Bear (Scenario Toggle col C): $3.5M/MW GPU rate, 5% flex commitment, $42/MWh DR rate, 90 curtailment hrs/yr, $260/MW-day PJM cap price.' },
          { id:'base',      name:'Base Case',         badge:'📊', color:'var(--text-2)',
            h100:3.73, gpuRate:5.00,   flexPct:8.2,  drRate:55,  curtailHrs:120,
            desc:'Excel Base (Scenario Toggle col D): $5.0M/MW GPU rate, 8.2% effective flex (SUMPRODUCT workload mix), $55/MWh DR rate, 120 curtailment hrs/yr, $329.17/MW-day PJM.' },
          { id:'bull',      name:'Bull Case',         badge:'🐂', color:'var(--green)',
            h100:4.85, gpuRate:6.50,   flexPct:12,   drRate:68,  curtailHrs:150,
            desc:'Excel Bull (Scenario Toggle col E): $6.5M/MW GPU rate, 12% flex commitment, $68/MWh DR rate, 150 curtailment hrs/yr, $395/MW-day PJM cap price.' },
          { id:'pricecomp', name:'Price Compression', badge:'📉', color:'var(--amber)',
            h100:1.34, gpuRate:1.796,  flexPct:65,   drRate:55,  curtailHrs:120,
            desc:'B200/GB200 commoditization drives H100 rates to $1.34/hr. CSPs compensate with 65% flex enrollment to monetize idle capacity via grid revenue — margin maintained through volume.' },
          { id:'highdr',    name:'High DR Market',    badge:'⚡', color:'var(--teal)',
            h100:2.24, gpuRate:3.00,   flexPct:65,   drRate:100, curtailHrs:120,
            desc:'High flex enrollment + elevated DR prices ($100/MWh). ERCOT grid stress increases frequency of scarcity events — 65% flex share captures substantial ancillary service revenue.' },
          { id:'fullflex',  name:'Full Flex Adoption', badge:'🚀', color:'var(--blue)',
            h100:2.24, gpuRate:3.00,   flexPct:90,   drRate:55,  curtailHrs:200,
            desc:'Near-full portfolio flex enrollment (90%). 200 curtailment hours/yr. Industry norm shift: most workloads accept preemption in exchange for pricing and DR revenue sharing.' },
          { id:'out2028',   name:'2028 Outlook',       badge:'🔭', color:'var(--purple)',
            h100:1.12, gpuRate:1.50,   flexPct:70,   drRate:65,  curtailHrs:130,
            desc:'2028 steady-state: $1.12/hr GPU rate after commoditization. 70% flex adoption standard practice. DR market matures to $65/MWh. High enrollment offsets price compression.' },
        ];

        const MW = 600;
        // Blended flex discount across non-inference workloads (from live workload mix sliders)
        const nonInfTotal = s.wlPreTrain + s.wlMLOps + s.wlResearch;
        const blendedDisc = nonInfTotal > 0
          ? (s.wlPreTrain*8 + s.wlMLOps*4 + s.wlResearch*18) / (nonInfTotal * 100)
          : 0.0847; // fallback to Excel default 8.47%

        const calcSc = (sc) => {
          const firmMW      = MW * (1 - sc.flexPct/100);
          const flexMW      = MW * (sc.flexPct/100);
          const drEligMW    = flexMW;
          // Annual Spend = reference list price (no discount, no utilization)
          const annualSpend = MW * sc.gpuRate;
          // L1: compute savings vs list price (no utilization factor — Excel methodology)
          const l1          = flexMW * sc.gpuRate * blendedDisc;
          // L2: DR credit at 50% customer share
          const l2          = drEligMW * sc.drRate * sc.curtailHrs * 0.50 / 1e6;
          const totalBenefit  = l1 + l2;
          const benefitPct    = annualSpend > 0 ? (totalBenefit / annualSpend) * 100 : 0;
          // CSP revenue components (incremental from flex product)
          const cspFirmPremium = firmMW * sc.gpuRate * 0.10;               // +10% SLA premium
          const cspFlexRev     = flexMW * sc.gpuRate * (1 - blendedDisc);  // flex tier revenue
          const cspDrRetained  = drEligMW * sc.drRate * sc.curtailHrs * 0.50 / 1e6; // CSP 50% DR
          const cspTotalRev    = cspFirmPremium + cspFlexRev + cspDrRetained;
          // Value split = customer benefit as % of CSP flex-enabled revenue
          const valueSplitCust = cspTotalRev > 0 ? (totalBenefit / cspTotalRev) * 100 : 0;
          return { firmMW, flexMW, drEligMW, annualSpend, l1, l2, totalBenefit, benefitPct,
            cspFirmPremium, cspFlexRev, cspDrRetained, cspTotalRev, valueSplitCust };
        };

        const computed = NAMED_SCENARIOS.map(sc => ({...sc, ...calcSc(sc)}));
        const [selId, setSelId] = React.useState('base');
        const sel = computed.find(s=>s.id===selId) || computed[1];

        const C = ({v,bold,color,right}) => (
          <td style={{padding:'7px 10px',fontFamily:'var(--mono)',fontSize:11,

            {/* Header */}
            <div style={{background:'var(--bg-raised)',borderBottom:'1px solid var(--border)',padding:'14px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
              <div>
                <p style={{fontSize:12,fontWeight:700,color:'var(--text-1)',margin:'0 0 2px'}}>
                  <span style={{color:'var(--green)',marginRight:6}}>§A</span>Named Scenario Analysis — 600 MW Portfolio
                </p>
                <p style={{fontSize:10,color:'var(--text-3)',margin:0}}>7 market scenarios × 15 KPIs · Click any scenario to see full breakdown</p>
              </div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {computed.map(sc=>(
                  <button key={sc.id} onClick={()=>setSelId(sc.id)}
                    style={{fontSize:9,fontWeight:600,padding:'4px 10px',borderRadius:5,border:`1px solid ${sc.id===selId?sc.color:'var(--border)'}`,
                      background:sc.id===selId?`${sc.color}22`:'transparent',
                      color:sc.id===selId?sc.color:'var(--text-3)',cursor:'pointer',transition:'all 0.15s',whiteSpace:'nowrap'}}>
                    {sc.badge} {sc.name}
                  </button>
                ))}
              </div>
            </div>

            {/* Scrollable table */}
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
                <thead>
                  <tr style={{borderBottom:'2px solid var(--border)'}}>
                    <th style={{position:'sticky',left:0,background:'var(--bg-raised)',padding:'8px 12px',textAlign:'left',fontSize:9,color:'var(--text-3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap',zIndex:1}}>Scenario</th>
                    <th colSpan={4} style={{padding:'5px 10px',textAlign:'center',fontSize:9,color:'var(--blue)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',borderLeft:'1px solid var(--border)'}}>Inputs</th>
                    <th colSpan={6} style={{padding:'5px 10px',textAlign:'center',fontSize:9,color:'var(--teal)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',borderLeft:'1px solid var(--border)'}}>Customer View</th>
                    <th colSpan={5} style={{padding:'5px 10px',textAlign:'center',fontSize:9,color:'var(--green)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',borderLeft:'1px solid var(--border)'}}>CSP Revenue View</th>
                  </tr>
                  <tr style={{borderBottom:'1px solid var(--border)',background:'var(--bg-overlay)'}}>
                    <th style={{position:'sticky',left:0,background:'var(--bg-overlay)',padding:'6px 12px',textAlign:'left',fontSize:9,color:'var(--text-3)',fontWeight:600,whiteSpace:'nowrap',zIndex:1}}>&nbsp;</th>
                    {[
                      {l:'H100 Rate',sub:'$/GPU-hr',c:'var(--blue)'},{l:'Flex Share',sub:'% enrolled',c:'var(--blue)'},

const sentimentColor = score => {
  if (score >= 4.5) return '#10b981';
  if (score >= 3.8) return '#2dd4bf';
  if (score >= 3.0) return '#ffb020';
  if (score >= 2.5) return '#ff8c42';
  return '#ff5c6a';
};
const metricValue = (r, mode) => ({price:r.lmpAvg,sentiment:r.sentiment,tariff:r.tariffDemand,queue:r.queueStd,flex:r.queueSavings}[mode]||r.sentiment);
const metricColor = (r, mode) => {
  if (mode==='price') { const v=r.lmpAvg; return v<25?'#10b981':v<45?'#2dd4bf':v<55?'#ffb020':'#ff5c6a'; }
  if (mode==='sentiment') return sentimentColor(r.sentiment);
  if (mode==='tariff') { const v=r.tariffDemand; return v<8?'#10b981':v<11?'#2dd4bf':v<13?'#ffb020':'#ff5c6a'; }
  if (mode==='queue') { const v=r.queueStd; return v<25?'#10b981':v<35?'#ffb020':v<45?'#ff8c42':'#ff5c6a'; }
  if (mode==='flex') { const v=r.queueSavings; return v>=22?'#10b981':v>=15?'#2dd4bf':v>=12?'#4da8ff':'#ffb020'; }
  return '#10b981';
};

              {l:'Queue Std → Flex',v:`${selected.queueStd}→${selected.queueFlex}mo`,s:`-${selected.queueSavings}mo saved`,c:'var(--green)'},
              {l:'Upsize Rev Δ',v:`$${selected.upsizeDelta}M/yr`,s:'per 50MW increment',c:'var(--blue)'},

          <div style={{background:'var(--bg-raised)',borderRadius:8,padding:'10px 12px',border:'1px solid var(--border)'}}>
            <p style={{fontSize:9,color:'var(--text-3)',margin:'0 0 3px',textTransform:'uppercase',letterSpacing:'0.06em'}}>Key Tenants</p>
            <p style={{fontSize:11,color:'var(--text-1)',margin:'0 0 7px',fontWeight:500}}>{selected.keyTenants}</p>
            <p style={{fontSize:9,color:'var(--text-3)',margin:'0 0 3px',textTransform:'uppercase',letterSpacing:'0.06em'}}>Market Intelligence</p>
            <p style={{fontSize:11,color:'var(--text-2)',margin:0,lineHeight:1.55}}>{selected.note}</p>
          </div>

          {/* Queue interplay */}
          <div style={{background:'rgba(16,185,129,0.06)',borderRadius:8,padding:'11px 13px',border:'1px solid rgba(16,185,129,0.18)'}}>
            <p style={{fontSize:10,color:'var(--green)',fontWeight:700,margin:'0 0 6px',textTransform:'uppercase',letterSpacing:'0.06em'}}>⚡ Queue Jump × Flex Load Interplay</p>
            <p style={{fontSize:11,color:'var(--text-2)',margin:'0 0 9px',lineHeight:1.55}}>
              A 25% flex commitment at <strong style={{color:'var(--text-1)'}}>{selected.name}</strong> cuts queue from{' '}
              <strong style={{color:'#ff5c6a'}}>{selected.queueStd}mo</strong> to{' '}
              <strong style={{color:'var(--green)'}}>{selected.queueFlex}mo</strong>, unlocking{' '}
              <strong style={{color:'var(--green)'}}>~${accelRev}M</strong> of accelerated GPU revenue.
            </p>
            <div style={{display:'flex',gap:8}}>
              {[{l:'WITHOUT FLEX',v:`${selected.queueStd}mo`,c:'#ff5c6a'},{l:'WITH FLEX',v:`${selected.queueFlex}mo`,c:'var(--green)'}].map((item,i)=>(
                <React.Fragment key={item.l}>
                  {i===1 && <div style={{display:'flex',alignItems:'center',color:'var(--green)',fontSize:18,fontWeight:300}}>→</div>}
                  <div style={{flex:1,background:'var(--bg-raised)',borderRadius:6,padding:'7px 10px',textAlign:'center'}}>
                    <p style={{fontSize:9,color:'var(--text-3)',margin:'0 0 2px'}}>{item.l}</p>
                    <p style={{fontSize:15,fontWeight:700,color:item.c,fontFamily:'var(--mono)',margin:0}}>{item.v}</p>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Bottom charts */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:18}}>
        <div style={{background:'var(--bg-surface)',borderRadius:12,border:'1px solid var(--border)',padding:20}}>
          <h4 style={{fontSize:13,fontWeight:700,color:'var(--text-1)',margin:'0 0 3px'}}>Interconnection Queue: Standard vs. Flexible</h4>
          <p style={{fontSize:11,color:'var(--text-2)',margin:'0 0 14px'}}>Months to interconnect by subregion — red = standard, green = with flex commitment</p>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={queueChartData} barGap={3} barCategoryGap="30%">
              <CartesianGrid strokeDasharray="3 3" stroke="#1e2f45" vertical={false}/>
              <XAxis dataKey="name" tick={{fill:'#7a90b0',fontSize:9}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fill:'#7a90b0',fontSize:9}} axisLine={false} tickLine={false} unit="mo" width={36}/>
              <Tooltip content={<CustomTooltip prefix="" suffix="mo"/>}/>
              <Legend wrapperStyle={{fontSize:11,color:'#7a90b0'}}/>
              <Bar dataKey="standard" name="Standard Queue" fill="#ff5c6a" opacity={0.65} radius={[3,3,0,0]}/>
              <Bar dataKey="flex" name="Flex Queue" fill="#10b981" radius={[3,3,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </div>

        <div style={{background:'var(--bg-surface)',borderRadius:12,border:'1px solid var(--border)',padding:20}}>
          <h4 style={{fontSize:13,fontWeight:700,color:'var(--text-1)',margin:'0 0 3px'}}>Time-to-Upsize Revenue Delta</h4>
          <p style={{fontSize:11,color:'var(--text-2)',margin:'0 0 14px'}}>Annual GPU revenue unlocked per 50MW upsize via flex queue acceleration</p>
          <ResponsiveContainer width="100%" height={220}>
            <BarChart data={upsizeData} layout="vertical" barCategoryGap="22%">
              <CartesianGrid strokeDasharray="3 3" stroke="#1e2f45" horizontal={false}/>
              <XAxis type="number" tick={{fill:'#7a90b0',fontSize:9}} axisLine={false} tickLine={false} unit="M"/>
              <YAxis type="category" dataKey="name" tick={{fill:'#7a90b0',fontSize:9}} axisLine={false} tickLine={false} width={62}/>
              <Tooltip content={<CustomTooltip prefix="$" suffix="M/yr"/>}/>
              <Bar dataKey="revenue" name="Revenue Delta" radius={[0,4,4,0]}>
                {upsizeData.map((d,i)=><Cell key={i} fill={d.color}/>)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>

      {/* Tariff table */}
      <div style={{background:'var(--bg-surface)',borderRadius:12,border:'1px solid var(--border)',padding:20}}>
        <h4 style={{fontSize:13,fontWeight:700,color:'var(--text-1)',margin:'0 0 3px'}}>Predicted Large Load Tariff Rates — {stateData.label}</h4>
        <p style={{fontSize:11,color:'var(--text-2)',margin:'0 0 14px'}}>Based on current utility rate filings and large load rider structures. Click any row to explore in the map above.</p>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead>
              <tr style={{borderBottom:'1px solid var(--border)'}}>
                {['Subregion','Market','Demand $/kW-mo','Energy $/kWh','Est. Annual @ 200MW','Sentiment','Queue Std→Flex','Flex Savings'].map(h=>(
                  <th key={h} style={{textAlign:'left',padding:'7px 10px',fontSize:9,color:'var(--text-3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {regions.map((r,i)=>{
                const annualCost = ((r.tariffDemand*1000*12)+(r.tariffEnergy*200000*8760*0.85))/1e6;
                const sc = sentimentColor(r.sentiment);
                const isSel = r.id===selected.id;
                return (
                  <tr key={r.id} onClick={()=>setSelectedId(r.id)}
                    style={{cursor:'pointer',borderBottom:'1px solid var(--border)',transition:'background 0.1s',
                      background:isSel?'var(--bg-overlay)':i%2===0?'transparent':'var(--bg-raised)'}}>
                    <td style={{padding:'9px 10px',color:'var(--text-1)',fontWeight:600,fontSize:12}}>{r.name}</td>
                    <td style={{padding:'9px 10px',color:'var(--text-2)',fontSize:11}}>
                      {geoState==='texas'?'ERCOT':geoState==='arizona'?(r.id==='eastvalley'?'SRP':'APS'):'Dominion'}
                    </td>
                    <td style={{padding:'9px 10px',fontFamily:'var(--mono)',color:'var(--amber)',fontSize:12}}>${r.tariffDemand.toFixed(2)}</td>
                    <td style={{padding:'9px 10px',fontFamily:'var(--mono)',color:'var(--text-2)',fontSize:12}}>${r.tariffEnergy.toFixed(3)}</td>
                    <td style={{padding:'9px 10px',fontFamily:'var(--mono)',color:'var(--text-1)',fontWeight:700,fontSize:12}}>${annualCost.toFixed(1)}M</td>
                    <td style={{padding:'9px 10px'}}>
                      <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 8px',borderRadius:10,
                        background:`${sc}22`,color:sc,fontSize:10,fontWeight:700,border:`1px solid ${sc}44`}}>
                        {r.sentiment.toFixed(1)} · {r.sentimentLabel}
                      </span>
                    </td>
                    <td style={{padding:'9px 10px',fontFamily:'var(--mono)',color:'var(--text-2)',fontSize:12}}>
                      {r.queueStd}→<span style={{color:'var(--green)'}}>{r.queueFlex}</span>mo
                    </td>
                    <td style={{padding:'9px 10px'}}>
                      <span style={{fontFamily:'var(--mono)',fontWeight:700,color:'var(--green)',fontSize:12}}>-{r.queueSavings}mo</span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <p style={{fontSize:10,color:'var(--text-3)',marginTop:10}}>
          * Annual cost estimate: 200MW at 85% load factor, 8,760 hrs/yr. Energy component only; excludes T&amp;D and ancillary charges. Data sourced from 2025–2026 utility large-load rate filings and FERC interconnection queue records.
        </p>
      </div>
    </div>
  );
};

// ── Main App ───────────────────────────────────────────────
const TABS = [
  { key:'portfolio', label:'Portfolio Overview', icon:'' },
  { key:'texas', label:'Texas / ERCOT', icon:'' },
  { key:'arizona', label:'Arizona / APS+SRP', icon:'' },
  { key:'virginia', label:'Virginia / PJM', icon:'' },
  { key:'sensitivity', label:'Sensitivity Analysis', icon:'' },
  { key:'csp', label:'CSP Revenue Model', icon:'' },
  { key:'geo', label:'Geo Intelligence', icon:'' },
];

const App = () => {
  const [s, setS] = useState({...DEFAULTS});
  const [tab, setTab] = useState('portfolio');
  const [pitchMode, setPitchMode] = useState(false);
  const [liveDataStatus, setLiveDataStatus] = useState('loading');

  // ── Claude Chat State ──
  const [chatOpen, setChatOpen]   = useState(false);
  const [chatMsgs, setChatMsgs]   = useState([]);
  const [chatInput, setChatInput] = useState('');
  const [chatLoading, setChatLoading] = useState(false);
  const [apiKey, setApiKey]       = useState(() => localStorage.getItem('emerald_claude_key') || '');
  const [showKeyInput, setShowKeyInput] = useState(false);
  const chatEndRef = React.useRef(null);

  const set = useCallback((key, val) => setS(prev => ({...prev, [key]: val})), []);
  const reset = useCallback(() => setS({...DEFAULTS}), []);

  useEffect(() => {
    // Attempt live ERCOT/EIA data fetch (graceful fallback)
    const timeout = setTimeout(() => setLiveDataStatus('fallback'), 5000);
    fetch('https://api.eia.gov/v2/electricity/wholesale-markets/data/?api_key=DEMO_KEY&frequency=annual&data[0]=price&facets[respondent][]=ERCO&offset=0&length=1')
      .then(r => r.json())
      .then(data => { clearTimeout(timeout); setLiveDataStatus('live'); })
      .catch(() => { clearTimeout(timeout); setLiveDataStatus('fallback'); });
    return () => clearTimeout(timeout);
  }, []);

  const effectiveFlexPct = useMemo(() => computeEffectiveFlexPct(s), [s]);

  const { tx, az, va } = useMemo(() => ({
    tx: calcTexas(s, effectiveFlexPct),
    az: calcArizona(s, effectiveFlexPct),
    va: calcVirginia(s, effectiveFlexPct),
  }), [s, effectiveFlexPct]);

  const totalNPV = tx.npv + az.npv + va.npv;

  // ── Chat scroll + send ──
  useEffect(() => { chatEndRef.current?.scrollIntoView({behavior:'smooth'}); }, [chatMsgs]);

  const sendChat = useCallback(async () => {
    const text = chatInput.trim();
    if (!text || chatLoading) return;
    if (!apiKey) { setShowKeyInput(true); return; }

    const userMsg = {role:'user', content:text};
    setChatMsgs(prev => [...prev, userMsg]);
    setChatInput('');
    setChatLoading(true);

    const systemPrompt = `You are the Emerald AI Compute Flexibility Value Calculator assistant. You help users understand the model's calculations, assumptions, and energy market context.

KEY MODEL FACTS:
- Portfolio: 600 MW total (Texas/ERCOT: ${s.txDcMW}MW, Arizona/APS+SRP: ${s.azDcMW}MW, Virginia/PJM: ${s.vaCurrentMW}MW)
- Workload mix: Pre-Training ${s.wlPreTrain}%, MLOps ${s.wlMLOps}%, Inference ${s.wlInference}%, Research ${s.wlResearch}%
- Effective flex %: ${(computeEffectiveFlexPct(s)).toFixed(1)}% (SUMPRODUCT of workload × curtail floor)
- GPU base rate: $${s.txGpuRate}M/MW/yr (Texas blended)
- Portfolio 10-yr NPV: $${(totalNPV/1000).toFixed(2)}B
- Texas NPV: $${(tx.npv/1e3).toFixed(0)}M | Arizona NPV: $${(az.npv/1e3).toFixed(0)}M | Virginia NPV: $${(va.npv/1e3).toFixed(0)}M
- ERCOT spike price: $${s.txSpikePrice}/MWh | TX DR cap rate: $${s.txDrCapRate}/kW-yr | TX DR energy rate: $${s.txDrEnergyRate}/MWh
- Interconnection acceleration: Texas ${s.txAccelMo}mo faster | Arizona ${s.azAccelMo}mo faster

CALCULATION LOGIC:
- Texas NPV = Time-to-Power value + Spike Avoidance (10yr) + DR Revenue (10yr) + Interconnect savings
- PJM Virginia: capacity market revenue via BRA auction clearing prices (~$50-100/MW-day)
- Effective flex % uses SUMPRODUCT: (wlPreTrain×0.16 + wlMLOps×0.08 + wlInference×0 + wlResearch×0.20) / 100

MARKET CONTEXT:
- ERCOT: energy-only, no capacity market, ~9,000 settlement points, islanded TX grid
- Arizona: APS/SRP vertically integrated, summer peak $280/MWh, APS E-32 flex tariff
- Virginia: PJM capacity market, BRA clearing ~$50-100/MW-day, Dominion territory, permitting congestion
- ERCOT battery storage queue: 110+ GW pending; 14.2 GW operational in 2025
- H100 blended fleet rate: $2-4M/MW/yr depending on supply/demand

Answer concisely and numerically where possible. Reference specific model figures.`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-opus-4-5',
          max_tokens: 1024,
          system: systemPrompt,
          messages: [...chatMsgs, userMsg].map(m => ({role:m.role,content:m.content})),
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(()=>({}));
        throw new Error(err?.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const reply = data.content?.[0]?.text || '(no response)';
      setChatMsgs(prev => [...prev, {role:'assistant', content:reply}]);
    } catch(e) {
      setChatMsgs(prev => [...prev, {role:'assistant', content:`⚠️ Error: ${e.message}. Check your API key or try again.`, isError:true}]);
    } finally {
      setChatLoading(false);
    }
  }, [chatInput, chatLoading, apiKey, chatMsgs, s, tx, az, va, totalNPV]);

  return (
    <div className="min-h-screen bg-slate-100">
      <GlobalControls s={s} set={set} pitchMode={pitchMode} setPitchMode={setPitchMode} reset={reset} totalNPV={totalNPV} effectiveFlexPct={effectiveFlexPct} />

      {/* Tab Bar */}
      <div className="bg-white border-b border-slate-200 sticky top-[72px] z-30">
        <div className="max-w-screen-2xl mx-auto px-4">
          <div className="flex overflow-x-auto">
            {TABS.map(t => (
              <button key={t.key} onClick={() => setTab(t.key)}
                style={{
                  display:'flex', alignItems:'center', gap:6,
                  padding:'0 18px', height:44,
                  fontSize:12.5, fontWeight: tab===t.key ? 600 : 500,
                  letterSpacing:'-0.01em',
                  whiteSpace:'nowrap', transition:'color 0.15s',
                  color: tab===t.key ? 'var(--green)' : 'var(--text-3)',
                  background:'transparent', border:'none', cursor:'pointer',
                  borderBottom: tab===t.key ? '2px solid var(--green)' : '2px solid transparent',
                  marginBottom:-1,
                }}>
                <span style={{fontFamily:'Inter,sans-serif'}}>{t.label}</span>
                {t.key !== 'portfolio' && t.key !== 'sensitivity' && t.key !== 'csp' && t.key !== 'geo' && (
                  <span style={{
                    fontSize:10, fontWeight:600, padding:'1px 6px', borderRadius:4,
                    background: t.key==='texas'?'rgba(45,212,191,0.12)':t.key==='arizona'?'rgba(167,139,250,0.12)':'rgba(96,165,250,0.12)',
                    color: t.key==='texas'?'var(--teal)':t.key==='arizona'?'var(--purple)':'var(--blue)',
                    fontFamily:"'JetBrains Mono',monospace",
                  }}>{fmtM(t.key==='texas'?tx.npv:t.key==='arizona'?az.npv:va.npv)}</span>
                )}
                {t.key === 'portfolio' && <span style={{
                  fontSize:10, fontWeight:600, padding:'1px 6px', borderRadius:4,
                  background:'rgba(16,185,129,0.12)', color:'var(--green)',
                  fontFamily:"'JetBrains Mono',monospace",
                }}>{fmtM(totalNPV)}</span>}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Main Content */}
      <div className="max-w-screen-2xl mx-auto px-4 py-8">
        {tab === 'portfolio' && <PortfolioTab s={s} tx={tx} az={az} va={va} pitchMode={pitchMode} />}
        {tab === 'texas' && <TexasTab s={s} set={set} tx={tx} pitchMode={pitchMode} effectiveFlexPct={effectiveFlexPct} />}
        {tab === 'arizona' && <ArizonaTab s={s} set={set} az={az} pitchMode={pitchMode} effectiveFlexPct={effectiveFlexPct} />}
        {tab === 'virginia' && <VirginiaTab s={s} set={set} va={va} pitchMode={pitchMode} effectiveFlexPct={effectiveFlexPct} />}
        {tab === 'sensitivity' && <SensitivityTab s={s} set={set} />}
        {tab === 'csp' && <CSPTab s={s} tx={tx} az={az} va={va} />}
        {tab === 'geo' && <GeoTab />}
      </div>

      {/* Footer */}
      <footer className="bg-white border-t border-slate-200 mt-12 py-5 px-4">
        <div className="max-w-screen-2xl mx-auto flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div style={{width:20,height:20,background:'linear-gradient(135deg,#10b981,#0d9488)',borderRadius:5,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:10,color:'#022c1c',flexShrink:0}}>⟡</div>
            <p style={{fontSize:11,color:'var(--text-3)',lineHeight:1.5}}>
              <strong style={{color:'var(--green)',fontWeight:600}}>Emerald AI</strong> — GPU Flexibility Value Model · <span style={{fontStyle:'italic'}}>Confidential & Proprietary</span>
              <span style={{color:'var(--border-hi)',margin:'0 6px'}}>·</span>
              Data: ERCOT LTDEF 2025, ERCOT TAC March 2026, PJM BRA 2026–2028, APS/SRP filings
            </p>
          </div>
          <div className="flex items-center gap-2">
            <span style={{fontSize:10,fontWeight:500,padding:'3px 10px',borderRadius:4,letterSpacing:'0.03em',
              background: liveDataStatus==='live'?'rgba(16,185,129,0.1)':liveDataStatus==='loading'?'rgba(245,158,11,0.1)':'rgba(75,98,128,0.2)',
              color: liveDataStatus==='live'?'var(--green)':liveDataStatus==='loading'?'var(--amber)':'var(--text-3)',
              border:`1px solid ${liveDataStatus==='live'?'rgba(16,185,129,0.25)':liveDataStatus==='loading'?'rgba(245,158,11,0.25)':'var(--border)'}`,
            }}>
              {liveDataStatus==='live'?'● Live EIA Data':liveDataStatus==='loading'?'● Checking data…':'● Verified Reference Data · Aug 2025'}
            </span>
          </div>
        </div>
      </footer>

      {/* ── Claude Chat Panel ── */}
      {/* FAB button */}
      <button onClick={()=>setChatOpen(o=>!o)}
        style={{position:'fixed',bottom:24,right:24,width:46,height:46,borderRadius:12,
          background:'var(--bg-raised)',border:'1px solid var(--border-hi)',cursor:'pointer',
          display:'flex',alignItems:'center',justifyContent:'center',
          boxShadow:'0 4px 16px rgba(0,0,0,0.5)',fontSize:16,zIndex:1000,
          color:'var(--text-2)',fontWeight:600,
          transition:'all 0.15s'}}
        onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--green)';e.currentTarget.style.color='var(--green)';e.currentTarget.style.boxShadow='0 4px 20px rgba(16,185,129,0.2)';}}
        onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--border-hi)';e.currentTarget.style.color='var(--text-2)';e.currentTarget.style.boxShadow='0 4px 16px rgba(0,0,0,0.5)';}}>
        {chatOpen ? '✕' : '⟡'}
      </button>

      {/* Chat window */}
      {chatOpen && (
        <div style={{position:'fixed',bottom:88,right:24,width:400,height:560,
          background:'var(--bg-surface)',borderRadius:14,border:'1px solid var(--border)',
          boxShadow:'0 20px 60px rgba(0,0,0,0.6)',display:'flex',flexDirection:'column',
          zIndex:999,overflow:'hidden',fontFamily:"'Inter',sans-serif"}}>

          {/* Chat header */}
          <div style={{background:'var(--bg-raised)',borderBottom:'1px solid var(--border)',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:9}}>
              <div style={{width:30,height:30,background:'linear-gradient(135deg,var(--green),var(--teal))',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>⟡</div>
              <div>
                <p style={{fontSize:12,fontWeight:700,color:'var(--text-1)',margin:0}}>Emerald AI Assistant</p>
                <p style={{fontSize:9,color:'var(--text-3)',margin:0}}>Powered by Claude · Ask about the model</p>
              </div>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button onClick={()=>setShowKeyInput(k=>!k)}
                style={{fontSize:9,color:'var(--text-3)',background:'var(--bg-overlay)',border:'1px solid var(--border)',borderRadius:5,padding:'3px 8px',cursor:'pointer'}}>
                🔑 API Key
              </button>
              <button onClick={()=>setChatMsgs([])}
                style={{fontSize:9,color:'var(--text-3)',background:'transparent',border:'none',cursor:'pointer',padding:'2px 4px'}}>
                Clear
              </button>
            </div>
          </div>

          {/* API key input (collapsible) */}
          {showKeyInput && (
            <div style={{padding:'10px 14px',background:'rgba(16,185,129,0.07)',borderBottom:'1px solid var(--border)',display:'flex',gap:8,alignItems:'center'}}>
              <input type="password" placeholder="sk-ant-api..." value={apiKey}
                onChange={e=>{ setApiKey(e.target.value); localStorage.setItem('emerald_claude_key',e.target.value); }}
                style={{flex:1,background:'var(--bg-raised)',border:'1px solid var(--border)',borderRadius:6,padding:'6px 10px',
                  fontSize:11,color:'var(--text-1)',outline:'none',fontFamily:'monospace'}}/>
              <button onClick={()=>setShowKeyInput(false)}
                style={{fontSize:11,color:'var(--green)',background:'transparent',border:'none',cursor:'pointer',fontWeight:700}}>✓</button>
            </div>
          )}

          {/* Messages area */}
          <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:10}}>
            {chatMsgs.length === 0 && (
              <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:8}}>
                <p style={{fontSize:11,color:'var(--text-3)',textAlign:'center',margin:'0 0 8px'}}>Ask anything about the model</p>
                {[
                  'What drives the Texas NPV calculation?',
                  'How does the effective flex % work?',
                  'Compare the 7 CSP scenarios for me',
                  'What is ERCOT\'s capacity market structure?',
                  'How does PJM BRA capacity revenue work?',
                ].map(q=>(
                  <button key={q} onClick={()=>{setChatInput(q);}}
                    style={{textAlign:'left',background:'var(--bg-raised)',border:'1px solid var(--border)',borderRadius:8,
                      padding:'8px 12px',fontSize:10,color:'var(--text-2)',cursor:'pointer',
                      transition:'border-color 0.1s',lineHeight:1.4}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor='var(--green)'}
                    onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                    {q}
                  </button>
                ))}
              </div>
            )}
            {chatMsgs.map((msg,i)=>(
              <div key={i} style={{display:'flex',flexDirection:'column',
                alignItems:msg.role==='user'?'flex-end':'flex-start'}}>
                <div style={{maxWidth:'88%',background:msg.role==='user'
                    ? 'linear-gradient(135deg,var(--green),#00a85a)'
                    : msg.isError ? 'rgba(248,113,113,0.12)' : 'var(--bg-raised)',
                  border: msg.role==='user' ? 'none'
                    : `1px solid ${msg.isError?'rgba(248,113,113,0.3)':'var(--border)'}`,
                  borderRadius: msg.role==='user' ? '12px 12px 2px 12px' : '12px 12px 12px 2px',
                  padding:'9px 13px',fontSize:11,lineHeight:1.65,
                  color:msg.role==='user'?'#042818':'var(--text-2)',
                  fontWeight:msg.role==='user'?500:400,
                  whiteSpace:'pre-wrap',wordBreak:'break-word'}}>
                  {msg.content}
                </div>
                <span style={{fontSize:9,color:'var(--text-3)',marginTop:3,marginLeft:4,marginRight:4}}>
                  {msg.role==='user'?'You':'Claude'}
                </span>
              </div>
            ))}
            {chatLoading && (
              <div style={{display:'flex',alignItems:'flex-start',gap:8}}>
                <div style={{background:'var(--bg-raised)',border:'1px solid var(--border)',borderRadius:'12px 12px 12px 2px',padding:'10px 14px'}}>
                  <div style={{display:'flex',gap:5,alignItems:'center'}}>
                    {[0,1,2].map(i=>(
                      <div key={i} style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',opacity:0.7,
                        animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`}}/>
                    ))}
                  </div>
                </div>
              </div>
            )}
            <div ref={chatEndRef}/>
          </div>

          {/* Input bar */}
          <div style={{borderTop:'1px solid var(--border)',padding:'10px 12px',background:'var(--bg-raised)',display:'flex',gap:8,alignItems:'flex-end'}}>
            <textarea value={chatInput} onChange={e=>setChatInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}}}
              placeholder={apiKey?'Ask about calculations, markets, scenarios…':'Add your Claude API key to start (🔑 above)'}
              rows={2} style={{flex:1,background:'var(--bg-overlay)',border:'1px solid var(--border)',borderRadius:8,
                padding:'8px 10px',fontSize:11,color:'var(--text-1)',resize:'none',outline:'none',
                lineHeight:1.5,fontFamily:"'Inter',sans-serif",
                transition:'border-color 0.1s'}}
              onFocus={e=>e.target.style.borderColor='var(--green)'}
              onBlur={e=>e.target.style.borderColor='var(--border)'}/>
            <button onClick={sendChat} disabled={!chatInput.trim()||chatLoading}
              style={{width:36,height:36,borderRadius:8,background:chatInput.trim()&&!chatLoading?'var(--green)':'var(--border)',
                border:'none',cursor:chatInput.trim()&&!chatLoading?'pointer':'default',
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0,
                transition:'background 0.15s'}}>
              {chatLoading ? '⏳' : '↑'}
            </button>
          </div>
        </div>
      )}

      <style>{`
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 0.5; }
          50% { transform: scale(1.3); opacity: 1; }
        }
      `}</style>

    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
